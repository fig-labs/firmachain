name: Create and publish a Docker image

on:
  push:
    branches:
      - chore/dockerize

env:
  REGISTRY_URL: 905690002248.dkr.ecr.ap-southeast-1.amazonaws.com
  REPOSITORY_NAME: firmachaind

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve image tag
        id: image_tag
        shell: bash
        run: echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::905690002248:role/PlatformGithubActionsRole
          aws-region: ap-southeast-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        
      - name: build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile-test
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.REPOSITORY_NAME }}:test-${{ steps.image_tag.outputs.image_tag }}
          platforms: linux/amd64
          build-args: |
            VERSION=test-${{ steps.image_tag.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=min,ignore-error=true